# ψ-slack experiments — conda (CUDA PyTorch). Prefer editing `name:` locally.
# conda env create -f environment.yml && conda activate psi-slack-experiments

name: psi-slack-experiments

channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults

dependencies:
  - python=3.10
  - pytorch>=2.0
  - torchvision>=0.15
  - pytorch-cuda=11.8
  - numpy>=1.20
  - scipy>=1.7
  - scikit-learn>=1.0
  - matplotlib>=3.5
  - pandas>=1.5
  - pillow>=9.0
  - tqdm>=4.60
  - pyyaml
  - pip
  - pip:
    - datasets>=2.0.0
    - huggingface-hub>=0.14.0
    - transformers>=4.30.0
    - git+https://github.com/openai/CLIP.git
    - open_clip_torch>=2.20.0
    - timm>=0.9.0
    - ftfy>=6.0.0
    - regex>=2022.0.0
    - fire>=0.5.0
